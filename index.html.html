<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel Financeiro</title>
<style>
:root{--bg:#f4f6f9;--card:#fff;--tx:#1d2733;--mut:#6b7785;--bd:#e1e6ec;--rec:#1a9e5c;--des:#d64545;--acc:#1f4e78}
@media (prefers-color-scheme:dark){:root{--bg:#10151b;--card:#1a212a;--tx:#e8edf2;--mut:#93a0ae;--bd:#2a3440;--rec:#3ecf8e;--des:#ff6b6b;--acc:#6fb1ea}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.4}
.wrap{max-width:1000px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0 12px}
h2{font-size:15px;margin:0 0 10px;color:var(--mut);font-weight:600}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input,select,button{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:8px 10px}
input[type=text]{flex:1;min-width:220px}
button{cursor:pointer;background:var(--acc);color:#fff;border-color:var(--acc)}
button.sec{background:transparent;color:var(--tx);border-color:var(--bd)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:12px}
.kpi .l{font-size:13px;color:var(--mut)}
.kpi .v{font-size:24px;font-weight:700;margin-top:2px}
.pos{color:var(--rec)}.neg{color:var(--des)}
.status{font-size:13px;color:var(--mut)}
.status.err{color:var(--des)}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--bd);white-space:nowrap}
th{color:var(--mut);font-weight:600;font-size:12px}
td.n,th.n{text-align:right}
.bars{display:flex;align-items:flex-end;gap:14px;height:170px;padding-top:8px;overflow-x:auto}
.mb{flex:1;min-width:56px;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%}
.mb .pair{flex:1;display:flex;align-items:flex-end;gap:4px;width:100%;justify-content:center}
.mb .b{width:40%;max-width:26px;border-radius:4px 4px 0 0;min-height:2px}
.mb .lab{font-size:12px;color:var(--mut)}
.hbar{height:8px;background:var(--bd);border-radius:4px;overflow:hidden;min-width:80px}
.hbar>i{display:block;height:100%;background:var(--des)}
.legend{font-size:12px;color:var(--mut);margin-top:6px}
.legend b{display:inline-block;width:10px;height:10px;border-radius:2px;vertical-align:middle;margin:0 4px 0 8px}
.empty{color:var(--mut);font-size:14px;padding:6px 0}
</style>
</head>
<body>
<div class="wrap">
  <h1>💰 Painel Financeiro</h1>

  <div class="card">
    <h2>Conexão com o Google Sheets</h2>
    <div class="row">
      <input type="text" id="url" placeholder="Cole aqui o link CSV publicado (…/pub?output=csv)">
      <select id="interval" title="Atualizar a cada">
        <option value="30">Atualizar a cada 30 s</option>
        <option value="60" selected>Atualizar a cada 1 min</option>
        <option value="300">Atualizar a cada 5 min</option>
        <option value="0">Só manualmente</option>
      </select>
      <button id="go">Conectar</button>
      <button id="demo" class="sec">Ver exemplo</button>
    </div>
    <div class="status" id="status" style="margin-top:8px">Aguardando link…</div>
  </div>

  <div class="row" style="margin-bottom:12px">
    <label for="month" class="status">Mês:</label>
    <select id="month"></select>
    <button class="sec" id="refresh">↻ Atualizar agora</button>
  </div>

  <div class="grid" id="kpis"></div>

  <div class="card"><h2>Receitas × Despesas por mês</h2><div class="bars" id="bars"></div>
    <div class="legend"><b style="background:var(--rec)"></b>Receitas<b style="background:var(--des)"></b>Despesas</div></div>

  <div class="card"><h2>Parcelamentos em andamento</h2><div class="tw" id="inst"></div></div>
  <div class="card"><h2>Maiores despesas do mês</h2><div class="tw" id="top"></div></div>
  <div class="card"><h2>Lançamentos do mês</h2><div class="tw" id="list"></div></div>
</div>

<script>
const $ = id => document.getElementById(id);
const brl = v => v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const esc = s => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();
const mkey = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
const mlabel = k => { const [y,m]=k.split('-'); return new Date(y,m-1,1).toLocaleDateString('pt-BR',{month:'short',year:'2-digit'}).replace('.',''); };
const mlong = k => { const [y,m]=k.split('-'); return new Date(y,m-1,1).toLocaleDateString('pt-BR',{month:'long',year:'numeric'}); };

let rows = [], timer = null;

/* ---------- leitura de CSV ---------- */
function parseCSV(t){
  const out=[]; let r=[], c='', q=false;
  for(let i=0;i<t.length;i++){
    const ch=t[i];
    if(q){ if(ch=='"'){ if(t[i+1]=='"'){c+='"';i++;} else q=false; } else c+=ch; }
    else if(ch=='"') q=true;
    else if(ch==','){ r.push(c); c=''; }
    else if(ch=='\n'||ch=='\r'){ if(ch=='\r'&&t[i+1]=='\n') i++; r.push(c); out.push(r); r=[]; c=''; }
    else c+=ch;
  }
  if(c!==''||r.length){ r.push(c); out.push(r); }
  return out.filter(x=>x.some(v=>v.trim()!==''));
}
function parseNum(s){
  s=String(s||'').replace(/R\$|\s/g,'');
  if(!s) return NaN;
  let neg=false; if(/^\(.*\)$/.test(s)||s.startsWith('-')){neg=true; s=s.replace(/[()\-]/g,'');}
  if(s.includes(',')) s=s.replace(/\./g,'').replace(',','.');
  else if(/^\d{1,3}(\.\d{3})+$/.test(s)) s=s.replace(/\./g,'');
  const n=parseFloat(s); return neg?-n:n;
}
function parseDate(s){
  s=String(s||'').trim(); let m;
  if(m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})/)){ let y=+m[3]; if(y<100) y+=2000; return new Date(y,+m[2]-1,+m[1]); }
  if(m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/)) return new Date(+m[1],+m[2]-1,+m[3]);
  return null;
}
function parseInst(s){
  s=String(s||'').trim(); let m;
  if(m=s.match(/^(\d+)\s*(?:\/|de)\s*(\d+)$/i)) return {cur:+m[1],tot:+m[2]};
  if(m=s.match(/^(\d+)$/)) return {cur:1,tot:+m[1]};
  return null;
}
function toRows(csv){
  const t=parseCSV(csv); if(t.length<2) return [];
  const h=t[0].map(norm);
  const ix=n=>h.findIndex(x=>x.startsWith(n));
  const iD=ix('data'), iDe=ix('descri'), iV=ix('valor'), iP=ix('parcela'), iT=ix('tipo');
  if(iD<0||iV<0||iT<0) throw new Error('Cabeçalhos não encontrados. Use: Data, Descrição, Valor, Parcelas, Tipo.');
  const res=[];
  for(const r of t.slice(1)){
    const date=parseDate(r[iD]), val=parseNum(r[iV]);
    if(!date||isNaN(val)) continue;
    const tipo=norm(r[iT]).startsWith('rec')?'R':'D';
    res.push({date,desc:(r[iDe]||'').trim(),val:Math.abs(val),tipo,inst:iP>=0?parseInst(r[iP]):null,instRaw:iP>=0?(r[iP]||'').trim():''});
  }
  return res.sort((a,b)=>b.date-a.date);
}

/* ---------- carregamento ---------- */
function setStatus(msg,err){ const s=$('status'); s.textContent=msg; s.className='status'+(err?' err':''); }
async function load(){
  const url=$('url').value.replace(/\s+/g,''); $('url').value=url;
  if(!url){ setStatus('Cole o link CSV publicado e clique em Conectar.',true); return; }
  try{
    setStatus('Carregando…');
    let res;
    try{ res=await fetch(url+(url.includes('?')?'&':'?')+'_='+Date.now(),{cache:'no-store'}); }
    catch(e1){ res=await fetch(url); }
    if(!res.ok) throw new Error('Erro '+res.status+' ao acessar o link.');
    rows=toRows(await res.text());
    setStatus('Atualizado às '+new Date().toLocaleTimeString('pt-BR')+' · '+rows.length+' lançamentos');
    render();
  }catch(e){
    setStatus('Falha: '+e.message+' Confira se o link é o de "Publicar na web" em formato CSV e se você abriu este arquivo no navegador (não dentro do Claude).',true);
  }
}
function schedule(){
  clearInterval(timer);
  const s=+$('interval').value; if(s>0) timer=setInterval(load,s*1000);
}
$('go').onclick=()=>{ try{localStorage.setItem('pf_url',$('url').value.trim());localStorage.setItem('pf_int',$('interval').value);}catch(e){} schedule(); load(); };
$('refresh').onclick=load;
$('interval').onchange=()=>{ try{localStorage.setItem('pf_int',$('interval').value);}catch(e){} schedule(); };
$('month').onchange=render;
$('demo').onclick=()=>{
  clearInterval(timer);
  const n=new Date(), d=(m,day)=>new Date(n.getFullYear(),n.getMonth()+m,day);
  rows=[];
  for(let m=-3;m<=0;m++){
    rows.push({date:d(m,5),desc:'Salário',val:5000,tipo:'R',inst:null,instRaw:''});
    rows.push({date:d(m,8),desc:'Aluguel',val:1500,tipo:'D',inst:null,instRaw:''});
    rows.push({date:d(m,12),desc:'Mercado',val:380+m*-25,tipo:'D',inst:null,instRaw:''});
    rows.push({date:d(m,15),desc:'Celular novo',val:250,tipo:'D',inst:{cur:7+m,tot:10},instRaw:(7+m)+'/10'});
  }
  rows.sort((a,b)=>b.date-a.date);
  setStatus('Mostrando dados de exemplo. Conecte seu link para ver os seus.');
  render();
};

/* ---------- renderização ---------- */
function render(){
  const keys=[...new Set(rows.map(r=>mkey(r.date)))].sort().reverse();
  const cur=$('month').value;
  const nowK=mkey(new Date());
  $('month').innerHTML='<option value="ALL">Todos os meses</option>'+keys.map(k=>`<option value="${k}">${mlong(k)}</option>`).join('');
  $('month').value = (cur && (cur==='ALL'||keys.includes(cur))) ? cur : (keys.includes(nowK)?nowK:(keys[0]||'ALL'));
  const sel=$('month').value;
  const inM=rows.filter(r=>sel==='ALL'||mkey(r.date)===sel);

  const rec=inM.filter(r=>r.tipo==='R').reduce((a,r)=>a+r.val,0);
  const des=inM.filter(r=>r.tipo==='D').reduce((a,r)=>a+r.val,0);
  const saldo=rec-des;
  const pend=activeInstallments().reduce((a,x)=>a+x.restante,0);
  $('kpis').innerHTML=
    kpi('Receitas',brl(rec),'pos')+kpi('Despesas',brl(des),'neg')+
    kpi('Saldo',brl(saldo),saldo>=0?'pos':'neg')+kpi('Parcelas a pagar',brl(pend),'');

  // barras
  const last=[...new Set(rows.map(r=>mkey(r.date)))].sort().slice(-6);
  const tot=last.map(k=>({k,r:sum(k,'R'),d:sum(k,'D')}));
  const mx=Math.max(1,...tot.flatMap(x=>[x.r,x.d]));
  $('bars').innerHTML=tot.length?tot.map(x=>`<div class="mb"><div class="pair">
    <div class="b" title="Receitas ${brl(x.r)}" style="height:${x.r/mx*100}%;background:var(--rec)"></div>
    <div class="b" title="Despesas ${brl(x.d)}" style="height:${x.d/mx*100}%;background:var(--des)"></div></div>
    <div class="lab">${mlabel(x.k)}</div></div>`).join(''):'<div class="empty">Sem dados.</div>';

  // parcelamentos
  const ins=activeInstallments();
  $('inst').innerHTML=ins.length?`<table><tr><th>Descrição</th><th class="n">Parcela</th><th class="n">Valor/parcela</th><th class="n">Faltam</th><th class="n">Total restante</th><th>Progresso</th></tr>`+
    ins.map(x=>`<tr><td>${esc(x.desc)}</td><td class="n">${x.cur}/${x.tot}</td><td class="n">${brl(x.val)}</td><td class="n">${x.tot-x.cur}</td><td class="n">${brl(x.restante)}</td>
    <td><div class="hbar"><i style="width:${x.cur/x.tot*100}%"></i></div></td></tr>`).join('')+'</table>'
    :'<div class="empty">Nenhum parcelamento em andamento.</div>';

  // maiores despesas
  const topMap={}; inM.filter(r=>r.tipo==='D').forEach(r=>{const k=r.desc||'(sem descrição)'; topMap[k]=(topMap[k]||0)+r.val;});
  const top=Object.entries(topMap).sort((a,b)=>b[1]-a[1]).slice(0,8);
  $('top').innerHTML=top.length?`<table>`+top.map(([k,v])=>`<tr><td>${esc(k)}</td><td class="n">${brl(v)}</td><td style="width:35%"><div class="hbar"><i style="width:${des?v/des*100:0}%"></i></div></td></tr>`).join('')+'</table>':'<div class="empty">Sem despesas neste período.</div>';

  // lista
  $('list').innerHTML=inM.length?`<table><tr><th>Data</th><th>Descrição</th><th>Parcelas</th><th>Tipo</th><th class="n">Valor</th></tr>`+
    inM.map(r=>`<tr><td>${r.date.toLocaleDateString('pt-BR')}</td><td>${esc(r.desc)}</td><td>${esc(r.instRaw)}</td><td>${r.tipo==='R'?'Receita':'Despesa'}</td>
    <td class="n ${r.tipo==='R'?'pos':'neg'}">${r.tipo==='R'?'+':'−'} ${brl(r.val)}</td></tr>`).join('')+'</table>':'<div class="empty">Nenhum lançamento.</div>';
}
function kpi(l,v,c){return `<div class="card kpi" style="margin:0"><div class="l">${l}</div><div class="v ${c}">${v}</div></div>`;}
function sum(k,t){return rows.filter(r=>mkey(r.date)===k&&r.tipo===t).reduce((a,r)=>a+r.val,0);}
function activeInstallments(){
  // pega a parcela mais avançada de cada compra (mesma descrição + total)
  const map={};
  rows.filter(r=>r.tipo==='D'&&r.inst&&r.inst.tot>1).forEach(r=>{
    const k=r.desc.toLowerCase()+'|'+r.inst.tot;
    if(!map[k]||r.inst.cur>map[k].cur) map[k]={desc:r.desc,val:r.val,cur:r.inst.cur,tot:r.inst.tot};
  });
  return Object.values(map).filter(x=>x.cur<x.tot).map(x=>({...x,restante:(x.tot-x.cur)*x.val})).sort((a,b)=>b.restante-a.restante);
}

/* ---------- início ---------- */
try{
  const u=localStorage.getItem('pf_url'), i=localStorage.getItem('pf_int');
  if(i) $('interval').value=i;
  if(u){ $('url').value=u; schedule(); load(); }
}catch(e){}
render();
</script>
</body>
</html>
